name: sync-trivy-db
on:
  schedule:
    - cron: '0 20 * * 0'   # 每周日 20:00 UTC = 北京周一 04:00
  workflow_dispatch: {}

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Install skopeo
        run: sudo apt-get update -qq && sudo apt-get install -y -qq skopeo
      - name: Login ACR
        run: echo "$ALIYUN_REGISTRY_PASSWORD" | skopeo login "$ALIYUN_REGISTRY" -u "$ALIYUN_REGISTRY_USER" --password-stdin
      - name: Copy trivy-db (ghcr -> ACR, schema2)
        run: |
          skopeo copy --format v2s2 --dest-tls-verify=false \
            docker://ghcr.io/aquasecurity/trivy-db:2 \
            docker://$ALIYUN_REGISTRY/lizuhub/security-trivy-db:2
      - name: Verify
        run: |
          skopeo inspect --tls-verify=false docker://$ALIYUN_REGISTRY/lizuhub/security-trivy-db:2 --format 'OK: {{.Digest}}'
